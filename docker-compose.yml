services:
  iris:
    build: ./iris
    image: iris-airbyte-adapter-iris
    container_name: iris
    ports:
      - "52773:52773"
      - "1972:1972"
    volumes:
      - ./src:/home/irisowner/dev/src
    # runs after IRIS starts: loads /home/irisowner/dev/src/cls into USER
    command: --after /home/irisowner/onstart.sh
    environment:
      # used by Airbyte.Demo.Production.Setup() to create the Postgres credentials (values from .env)
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/irisHealth.sh && test -f /home/irisowner/onstart.done"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      worker:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./demo/postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./demo/scenarios:/scenarios:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build: ./worker
    image: iris-airbyte-adapter-worker
    container_name: worker
    ports:
      - "8000:8000"
    environment:
      READ_TIMEOUT_SECONDS: ${READ_TIMEOUT_SECONDS:-120}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-3600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - airbyte-cache:/data
      - /tmp/airbyte:/tmp/airbyte
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  airbyte-cache:
